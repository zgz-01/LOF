<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOF基金溢价排行</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #0f1923;
            color: #e0e6ed;
            padding: 16px;
            min-height: 100vh;
        }
        .header {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e3a5f;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #4fc3f7;
        }
        .header .sub {
            font-size: 13px;
            color: #78909c;
            margin-top: 4px;
        }
        .header .update-time {
            font-size: 12px;
            color: #546e7a;
            margin-top: 2px;
        }
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filters button {
            padding: 6px 14px;
            border: 1px solid #1e3a5f;
            background: #15202b;
            color: #78909c;
            border-radius: 16px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .filters button.active {
            background: #1e3a5f;
            color: #4fc3f7;
            border-color: #4fc3f7;
        }
        .filters button:hover { background: #1a2d42; }
        .card {
            background: #15202b;
            border: 1px solid #1e3a5f;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .card:hover { background: #1a2d42; }
        .card .left { flex: 1; }
        .card .code { font-size: 12px; color: #546e7a; }
        .card .name { font-size: 15px; font-weight: 500; margin: 2px 0; }
        .card .info { font-size: 11px; color: #546e7a; }
        .card .right { text-align: right; min-width: 100px; }
        .card .premium { font-size: 24px; font-weight: 700; }
        .card .premium.red { color: #ef5350; }
        .card .premium.orange { color: #ff9800; }
        .card .premium.gold { color: #ffd54f; }
        .card .premium.green { color: #66bb6a; }
        .card .premium.blue { color: #42a5f5; }
        .card .premium.purple { color: #ab47bc; }
        .card .premium.gray { color: #546e7a; }
        .card .premium-label { font-size: 11px; color: #546e7a; }
        .card .nav-info { font-size: 11px; color: #37474f; margin-top: 2px; }
        .loading { text-align: center; padding: 40px; color: #546e7a; }
        .error { text-align: center; padding: 40px; color: #ef5350; }
        .footer { text-align: center; padding: 20px; font-size: 12px; color: #37474f; }
        @media (max-width: 480px) {
            .card { flex-direction: column; align-items: flex-start; }
            .card .right { text-align: left; margin-top: 8px; min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 LOF 基金溢价排行</h1>
        <div class="sub">QDII/LOF/ETF 实时溢价率监控</div>
        <div class="update-time" id="updateTime">加载中...</div>
    </div>

    <div class="filters">
        <button class="active" data-filter="all" onclick="setFilter('all')">全部</button>
        <button data-filter="premium" onclick="setFilter('premium')">溢价</button>
        <button data-filter="discount" onclick="setFilter('折价')">折价</button>
        <button data-filter="high" onclick="setFilter('high')">高溢价 &gt;3%</button>
        <button data-filter="us" onclick="setFilter('us')">美股QDII</button>
    </div>

    <div id="fundList"></div>

    <div class="footer">
        ⚠️ 数据仅供参考，不构成投资建议 | 数据源: palmmicro.com + Yahoo Finance
    </div>

    <script>
        // 美股QDII代码前缀
        const US_FUNDS = new Set(['513100','513110','513390','513870','513500','513650',
            '161125','159632','159941','159660','159696','513300','513050','164906',
            '162411','162415','513350']);

        let allFunds = [];
        let currentFilter = 'all';

        function getPremiumClass(pct) {
            if (pct === null || pct === undefined) return 'gray';
            if (pct > 5) return 'red';
            if (pct > 3) return 'orange';
            if (pct > 1) return 'gold';
            if (pct > 0) return 'green';
            if (pct > -1) return 'blue';
            return 'purple';
        }

        function formatPremium(pct) {
            if (pct === null || pct === undefined) return '-';
            const sign = pct > 0 ? '+' : '';
            return sign + pct.toFixed(2) + '%';
        }

        function getSourceLabel(fund) {
            if (fund.realtime_premium !== null && fund.realtime_premium !== undefined) {
                return '实时';
            }
            if (fund.fair_premium !== null && fund.fair_premium !== undefined) {
                return '参考';
            }
            return '官方';
        }

        function getDisplayPremium(fund) {
            return fund.realtime_premium ?? fund.fair_premium ?? fund.official_premium;
        }

        function filterFunds(filter) {
            if (filter === 'all') return allFunds;
            if (filter === 'premium') return allFunds.filter(f => (getDisplayPremium(f) || 0) > 0);
            if (filter === '折价') return allFunds.filter(f => (getDisplayPremium(f) || 0) < 0);
            if (filter === 'high') return allFunds.filter(f => (getDisplayPremium(f) || 0) > 3);
            if (filter === 'us') {
                return allFunds.filter(f => {
                    const code = f.code.replace(/[A-Z]/g, '');
                    for (const prefix of US_FUNDS) {
                        if (code.startsWith(prefix) || f.code.endsWith(prefix)) return true;
                    }
                    return false;
                });
            }
            return allFunds;
        }

        function render() {
            const list = document.getElementById('fundList');
            const filtered = filterFunds(currentFilter);

            if (filtered.length === 0) {
                list.innerHTML = '<div class="loading">暂无数据</div>';
                return;
            }

            let html = '';
            filtered.forEach((fund, i) => {
                const pct = getDisplayPremium(fund);
                const cls = getPremiumClass(pct);
                const label = getSourceLabel(fund);
                const detailUrl = `/fund/${fund.code}`;

                html += `
                    <a href="${detailUrl}" style="text-decoration:none;color:inherit">
                    <div class="card">
                        <div class="left">
                            <div class="code">${fund.code}</div>
                            <div class="name">${fund.name}</div>
                            <div class="info">${fund.nav_date || ''} ${label}EST</div>
                        </div>
                        <div class="right">
                            <div class="premium ${cls}">${formatPremium(pct)}</div>
                            <div class="premium-label">溢价率</div>
                        </div>
                    </div>
                    </a>
                `;
            });

            list.innerHTML = html;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filters button').forEach(b => {
                b.classList.toggle('active', b.dataset.filter === filter);
            });
            render();
        }

        async function loadData() {
            try {
                const resp = await fetch('/api/data');
                const data = await resp.json();
                
                if (data.error) {
                    document.getElementById('fundList').innerHTML = 
                        `<div class="error">❌ ${data.error}</div>`;
                    return;
                }

                allFunds = data.premium_list || [];

                const ts = data.cached_at || data.timestamp;
                if (ts) {
                    document.getElementById('updateTime').textContent = 
                        `更新: ${ts.substring(0, 16)} | 共 ${data.count} 只基金`;
                }

                render();
            } catch (e) {
                document.getElementById('fundList').innerHTML = 
                    `<div class="error">❌ 数据加载失败: ${e.message}</div>`;
            }
        }

        // 每60秒自动刷新
        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
